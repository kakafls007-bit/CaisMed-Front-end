<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header header-compact">
      <a href="index.html" class="back-btn" data-fallback="index.html"></a>
      <div class="logo logo-inline">
        <span class="logo-icon"></span>
        <span>CaisMed</span>
      </div>
    </header>

    <main class="app-body">
      <p class="intro-text left">Crie Sua Conta</p>

      <form id="cadastro-form">
        <div class="field">
          <label for="nome" class="accent">Nome Completo</label>
          <input type="text" id="nome" name="nome" required />
        </div>

        <div class="field">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" inputmode="numeric" pattern="[0-9]*" maxlength="11" required />
        </div>

        <div class="field">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" required />
        </div>

        <div class="field">
          <label for="email" class="accent">E-mail</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" minlength="6" required />
        </div>

        <div class="field">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" required />
        </div>

        <div class="field">
          <label for="plano" style="visibility:hidden; height:0; margin:0;">Escolha o Plano</label>
          <select id="plano" name="plano" required>
            <option value="" disabled selected>Escolha o Plano</option>
            <option value="basico">Básico</option>
            <option value="intermediario">Intermediário</option>
            <option value="premium">Premium</option>
          </select>
        </div>

        <div class="bottom-area">
          <button type="submit" class="btn">Criar Conta</button>
        </div>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
